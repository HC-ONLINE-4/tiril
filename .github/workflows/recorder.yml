name: tiktok-recorder

# El job en si chequea a TikTok cada 60 segundos y graba el live completo.
# Este cron de respaldo solo reinicia el job si el runner muere (max 6h por job).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Grabar live
        env:
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER: ${{ secrets.DRIVE_FOLDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLL_SECONDS: ${{ vars.POLL_SECONDS }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS }}
        run: python actions_recorder.py
