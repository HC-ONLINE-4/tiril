name: tiktok-recorder

# Grabacion continua: cada job dura 5h y al terminar dispara el siguiente.
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Solo un job a la vez - si hay uno corriendo, el siguiente espera
concurrency:
  group: recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install --retries 5 --timeout 60 -r requirements-actions.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Grabar live
        env:
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
          DRIVE_OAUTH_JSON: ${{ secrets.DRIVE_OAUTH_JSON }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER: ${{ secrets.DRIVE_FOLDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLL_SECONDS: ${{ vars.POLL_SECONDS }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS }}
        run: python actions_recorder.py

      - name: Programar siguiente ejecucion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Disparando siguiente ciclo de grabacion..."
          gh workflow run recorder.yml --ref ${{ github.ref_name }}
          echo "Siguiente ejecucion programada."
