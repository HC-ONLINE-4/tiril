services:
  recorder:
    build: .
    container_name: tiktok-recorder
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./browser_profile:/app/browser_profile
      - ./grabaciones:/app/grabaciones
      - ./logs:/app/logs

  web:
    build: .
    container_name: tiktok-web
    restart: unless-stopped
    command: uvicorn webui.main:app --host 0.0.0.0 --port 8080
    env_file: .env
    volumes:
      - ./grabaciones:/app/grabaciones
    ports:
      - "8080:8080"
